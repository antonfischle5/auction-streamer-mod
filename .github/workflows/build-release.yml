name: Build and publish Minecraft 1.21.11 mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build mod
        run: gradle clean build

      - name: Prepare downloadable JAR
        run: |
          mkdir -p release
          cp build/libs/auction-streamer-mod-1.0.0.jar release/auction-streamer-mod-1.21.11.jar

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1.21.11-build-${{ github.run_number }}
          name: Minecraft 1.21.11 build ${{ github.run_number }}
          body: |
            Automatic build of Auction Streamer Mod for Minecraft Java Edition 1.21.11.
            Download the JAR asset and place it in your Minecraft mods folder.
          files: release/auction-streamer-mod-1.21.11.jar
          make_latest: true
